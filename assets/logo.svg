<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6b2f2f"/>
      <stop offset="0.5" stop-color="#8b3a3a"/>
      <stop offset="1" stop-color="#5a2020"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Outer rounded square -->
  <rect x="4" y="4" width="120" height="120" rx="24" fill="url(#bg)"/>
  <!-- Shine overlay -->
  <rect x="4" y="4" width="120" height="120" rx="24" fill="url(#shine)"/>
  <!-- Inner border -->
  <rect x="14" y="14" width="100" height="100" rx="18" fill="none" stroke="#fff" stroke-opacity="0.3" stroke-width="1.5"/>
  <!-- Center character -->
  <text x="64" y="84" font-size="52" text-anchor="middle" fill="#fff" font-family="STSong, SimSun, serif" font-weight="bold">经</text>
  <!-- Small corner marks (classical seal style) -->
  <text x="24" y="130" font-size="10" fill="#fff" fill-opacity="0.15" font-family="STSong, SimSun, serif">◈</text>
</svg>